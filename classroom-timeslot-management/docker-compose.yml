services:
  classroom-management:
    image: asdnn.com:45443/yl/classroom-management:latest
    container_name: classroom-timeslot-management
    ports:
      - "45103:80"
    environment:
      TZ: Asia/Shanghai
    networks:
      - classroom-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  classroom-network:
    driver: bridge
